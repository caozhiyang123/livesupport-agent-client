<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveSupport Chat</title>
  <!-- marked.js: renders Markdown (returned by the agent, e.g. **bold**,
       ### headings, | tables |) into real HTML. Loaded from a CDN since
       this project has no build step; pinned to a specific version to
       avoid unannounced breaking changes. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 1rem;
    }
    #message-list {
      border: 1px solid #ccc;
      height: 60vh;
      overflow-y: auto;
      padding: 0.5rem;
      margin-bottom: 0.5rem;
    }

    /* Each message is its own row: avatar icon + bubble, side by side. */
    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      margin: 0.75rem 0;
    }

    .avatar {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #fff;
    }

    .avatar.user {
      background: #6b7280; /* grey */
    }

    .avatar.agent {
      background: linear-gradient(135deg, #7c3aed, #4f46e5); /* purple gradient */
    }

    .message-bubble {
      flex: 1 1 auto;
      min-width: 0;
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      line-height: 1.5;
      overflow-wrap: break-word;
    }

    .message-bubble.user {
      background: #f3f4f6;
    }

    .message-bubble.agent {
      background: #ffffff;
      border: 1px solid #e5e7eb;
    }

    /* Markdown rendering inside agent bubbles: tables, headings, etc. */
    .message-bubble table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.5rem 0;
    }
    .message-bubble th,
    .message-bubble td {
      border: 1px solid #d1d5db;
      padding: 0.35rem 0.6rem;
      text-align: left;
    }
    .message-bubble th {
      background: #f9fafb;
    }
    .message-bubble p {
      margin: 0.4rem 0;
    }
    .message-bubble code {
      background: #f3f4f6;
      padding: 0.1rem 0.3rem;
      border-radius: 0.25rem;
    }

    .error-banner {
      color: #a00;
      border: 1px solid #a00;
      padding: 0.5rem;
      margin: 0.5rem 0;
      display: none;
    }
    .incomplete-indicator {
      color: #a60;
      font-style: italic;
      display: none;
    }
    #input-row {
      display: flex;
      gap: 0.5rem;
    }
    #message-input {
      flex: 1;
      padding: 0.5rem;
    }

    /* Image preview strip above the input row, shown only while images
       are pending and only when SUPPORT_IMAGE is enabled. */
    #image-preview-row {
      display: none;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .image-preview-thumb {
      position: relative;
      width: 64px;
      height: 64px;
    }
    .image-preview-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 0.375rem;
      border: 1px solid #d1d5db;
    }
    .image-preview-remove {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      line-height: 16px;
      padding: 0;
      border-radius: 50%;
      border: none;
      background: #374151;
      color: #fff;
      font-size: 0.75rem;
      cursor: pointer;
    }

    /* Thumbnails for images attached to a sent user message bubble. */
    .message-image-row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
    }
    .message-image-thumb {
      width: 96px;
      height: 96px;
      object-fit: cover;
      border-radius: 0.375rem;
      border: 1px solid #d1d5db;
    }

    #image-input-button {
      display: none;
    }
  </style>
</head>
<body>
  <h1>LiveSupport Chat</h1>

  <div id="error-banner" class="error-banner"></div>
  <div id="incomplete-indicator" class="incomplete-indicator">Response incomplete.</div>

  <div id="message-list"></div>

  <div id="image-preview-row"></div>

  <div id="input-row">
    <input type="file" id="image-input-button" accept="image/*" multiple>
    <button id="attach-image-button" type="button" title="Attach image" style="display:none;">&#128247;</button>
    <input type="text" id="message-input" placeholder="Type your message..." autocomplete="off">
    <button id="send-button" type="button">Send</button>
    <button id="new-conversation-button" type="button">New Conversation</button>
  </div>

  <script src="chat.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var input = document.getElementById("message-input");
      var sendButton = document.getElementById("send-button");
      var newConversationButton = document.getElementById("new-conversation-button");
      var attachImageButton = document.getElementById("attach-image-button");
      var imageInputButton = document.getElementById("image-input-button");

      function handleSend() {
        var text = input.value;
        sendMessage(text);
        input.value = "";
      }

      sendButton.addEventListener("click", handleSend);

      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          handleSend();
        }
      });

      newConversationButton.addEventListener("click", function () {
        startNewConversation();
      });

      // Image paste/drop/file-picker support, gated by SUPPORT_IMAGE
      // (fetched from GET /api/config). The attach button and drop/paste
      // handling only take effect once image support is confirmed enabled.
      loadImageConfig().then(function (config) {
        if (!config.support_image) {
          return;
        }

        attachImageButton.style.display = "inline-block";

        attachImageButton.addEventListener("click", function () {
          imageInputButton.click();
        });

        imageInputButton.addEventListener("change", function () {
          Array.from(imageInputButton.files || []).forEach(function (file) {
            addPendingImage(file);
          });
          imageInputButton.value = "";
        });

        input.addEventListener("paste", function (event) {
          var items = (event.clipboardData && event.clipboardData.items) || [];
          Array.from(items).forEach(function (item) {
            if (item.kind === "file" && item.type.startsWith("image/")) {
              var file = item.getAsFile();
              if (file) {
                addPendingImage(file);
              }
            }
          });
        });

        ["dragover", "drop"].forEach(function (eventName) {
          document.body.addEventListener(eventName, function (event) {
            event.preventDefault();
          });
        });

        document.body.addEventListener("drop", function (event) {
          var files = (event.dataTransfer && event.dataTransfer.files) || [];
          Array.from(files).forEach(function (file) {
            addPendingImage(file);
          });
        });
      });
    });
  </script>
</body>
</html>
