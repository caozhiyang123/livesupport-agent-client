# nginx location block snippet template for LiveSupport Web Chat
#
# This is a *snippet* intended to be included inside an existing `server {}`
# block (the one that already terminates TLS on 443 and/or listens on 80),
# not a standalone, includable nginx config on its own. Typical usage:
#
#   server {
#       listen 443 ssl;
#       server_name chat.example.com;
#       ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
#
#       include /etc/nginx/snippets/nginx-livesupport.conf;
#   }
#
# Install:
#   sudo cp deploy/nginx-livesupport.conf /etc/nginx/snippets/nginx-livesupport.conf
#   # add `include /etc/nginx/snippets/nginx-livesupport.conf;` inside your server block
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Upstream: the FastAPI app runs behind uvicorn on 127.0.0.1:8008, matching
# the ExecStart in deploy/livesupport-web.service. Adjust the upstream
# address if uvicorn is bound elsewhere.
# Requirements: 8.1, 8.2.

upstream livesupport_web_upstream {
    server 127.0.0.1:8008;
}

# Streaming chat endpoint: the response is a Server-Sent Events
# (text/event-stream) stream, so nginx MUST NOT buffer it or chunks will be
# held back and delivered in bursts instead of as they arrive (Req 8.1).
# The AgentCore Runtime call can run long (READ_TIMEOUT_SECONDS = 300 in
# agent_client.py), so proxy_read_timeout is raised well above nginx's
# 60s default to avoid nginx cutting the stream before the backend
# finishes (Req 8.2).
location /api/chat {
    proxy_pass http://livesupport_web_upstream;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Disable response buffering so SSE chunks are forwarded to the client
    # as soon as the backend emits them.
    proxy_buffering off;

    # Elevated read timeout to accommodate long-running agent invocations
    # (well above nginx's default 60s, matching the backend's own timeout).
    proxy_read_timeout 300s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Everything else (the chat page markup and static assets such as chat.js)
# is proxied to the same uvicorn upstream with standard buffering/timeouts.
location / {
    proxy_pass http://livesupport_web_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
